# Packages and uploads a release when a version tag is pushed (v1.0.0,
# v0.9.0-beta1 - "beta" / "alpha" in the tag sets CurseForge's release type).
# Needs the repository secret CF_API_TOKEN (CurseForge API token) and
# "## X-Curse-Project-ID" in the TOC; without the ID it only makes a GitHub
# release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
